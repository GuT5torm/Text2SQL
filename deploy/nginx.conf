# Text2SQL 电商数据分析 Agent —— Nginx 反向代理配置
#
# 适用前提：有域名与证书的 Linux 场景，或需要把前后端收口到同一个 80/443 端口的场景。
# 本地单机演示直接访问 http://127.0.0.1:8000/docs 即可，不需要本文件。
#
# 用法（Linux）：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/text2sql.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Windows 下用 Nginx 时，root 与 alias 路径写成正斜杠形式，
# 例如 root C:/Text2SQL/frontend/dist;  盘符字母的大小写需与实际一致。

upstream text2sql_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 只提交 JSON 与 SSE，限制请求体大小避免异常上传打满磁盘
    client_max_body_size 2m;

    access_log /var/log/nginx/text2sql.access.log;
    error_log  /var/log/nginx/text2sql.error.log;

    # ---------------------------------------------------------------
    # API 与 SSE
    #
    # /api/chat 走 Server-Sent Events 推送阶段进度，Nginx 默认会缓冲响应，
    # 缓冲不关的话前端收不到逐条的 stage 事件，整条进度在最后一次性到达。
    # 下面五项缺一不可，改动前请先读注释。
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://text2sql_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. 关闭响应缓冲，SSE 事件即时下发
        proxy_buffering off;
        # 2. 关闭代理缓存
        proxy_cache off;
        # 3. 关闭 gzip。压缩会让后端写完的内容滞留在压缩缓冲区里
        gzip off;
        # 4. 标准兼容做法，告诉下游中间件不要缓冲该响应
        add_header X-Accel-Buffering no;
        # 5. 长连接读超时。一次问答含 LLM 推理与最多四次 SQL 修正尝试，
        #    默认 60s 在慢模型下会被提前切断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---------------------------------------------------------------
    # 前端静态资源
    #
    # 先执行 npm run build 产出 frontend/dist。开发阶段前端由 vite 单独跑在
    # 5173 端口，本段不生效也不影响调试。
    # ---------------------------------------------------------------
    location / {
        root /opt/text2sql/frontend/dist;
        try_files $uri $uri/ /index.html;

        # index.html 不缓存，避免发版后浏览器仍取旧入口导致 chunk 404
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 构建产物带内容 hash，可长缓存
    location /assets/ {
        root /opt/text2sql/frontend/dist;
        expires 7d;
        add_header Cache-Control "public";
    }
}
