# 表结构与字段元数据
#
# 本文件是「字段白名单」的唯一来源：db/guard.py 校验生成的 SQL 时，
# 出现的每一张表、每一个字段都必须在此登记，否则视为模型编造，直接拦截。
#
# 字段说明：
#   name / type / display   物理名、类型、中文显示名
#   enum                    枚举值含义，帮助模型理解 status 这类编码字段
#   definition              含 enum 的字段必须说明该枚举的划分依据（收货地址、
#                           状态机、注册入口等），用于口径面板（FR-D-3）展示
#                           与加载期一致性校验（FR-M-4）。不含 enum 的字段
#                           可不写。
#   note                    特殊约定，例如日期函数用法
#
# 维度单列在文件末尾的 dimensions 段。维度不是物理列（例如「月份」由
# created_at 派生），但它们是业务提问的最小单位，必须与指标分开维护。

tables:
  - name: users
    display: 用户表
    synonyms: [用户, 会员, 买家, 客户, 消费者]
    grain: 一行一个注册用户
    fields:
      - name: id
        type: INTEGER
        display: 用户ID
      - name: name
        type: TEXT
        display: 用户昵称
      - name: city
        type: TEXT
        display: 所在城市
      - name: level
        type: TEXT
        display: 会员等级
        definition: 按该用户历史累计实付订单金额（已排除 cancelled/pending）分层；分层阈值随业务调整，定义于会员运营规则口径。
        enum:
          normal: 普通会员
          silver: 银卡
          gold: 金卡
          platinum: 白金卡
      - name: channel
        type: TEXT
        display: 注册渠道
        definition: 按用户完成注册时使用的入口划分，由前端埋点写入。
        enum:
          app: App
          h5: H5
          miniprogram: 小程序
          pc: PC
      - name: register_date
        type: TEXT
        display: 注册日期
        note: 格式 YYYY-MM-DD
      - name: phone
        type: TEXT
        display: 手机号
        sensitive: true
        mask: phone
        note: 敏感字段，任何结果集出参一律按手机号规则脱敏（前 3 后 4）
      - name: id_card
        type: TEXT
        display: 身份证号
        sensitive: true
        mask: idcard
        note: 敏感字段，任何结果集出参一律按身份证规则脱敏（前 6 后 4）

  - name: categories
    display: 商品类目表
    synonyms: [类目, 分类, 品类, 类目树]
    grain: 一行一个类目；parent_id 为空表示一级类目
    fields:
      - name: id
        type: INTEGER
        display: 类目ID
      - name: name
        type: TEXT
        display: 类目名称
      - name: parent_id
        type: INTEGER
        display: 上级类目ID
        note: 为空表示一级类目；统计「各品类」时通常取 level 2 的类目，并 JOIN 自身取一级类目名

  - name: products
    display: 商品表
    synonyms: [商品, 产品, 货品, SPU]
    grain: 一行一个商品
    fields:
      - name: id
        type: INTEGER
        display: 商品ID
      - name: name
        type: TEXT
        display: 商品名称
      - name: category_id
        type: INTEGER
        display: 所属类目ID
        ref: categories.id
      - name: brand
        type: TEXT
        display: 品牌
      - name: cost_price
        type: REAL
        display: 成本价
      - name: list_price
        type: REAL
        display: 标价
        note: 非成交价。成交价在 order_items.unit_price

  - name: orders
    display: 订单表
    synonyms: [订单, 单子, 交易, 单量]
    grain: 一行一个订单
    fields:
      - name: id
        type: INTEGER
        display: 订单ID
      - name: user_id
        type: INTEGER
        display: 下单用户ID
        ref: users.id
      - name: status
        type: TEXT
        display: 订单状态
        definition: 订单状态机，由下单 → 支付 → 履约 → 完成 / 取消 / 退款 的单向转移构成；任一状态变更按业务规则触发，不存在逆向回退（除人工介入的退款特例）。
        enum:
          pending: 待支付
          paid: 已支付
          shipped: 已发货
          completed: 已完成
          cancelled: 已取消
          refunded: 已退款
        note: 统计成交类指标时需排除 cancelled；需要口径一致时同时排除 pending
      - name: region
        type: TEXT
        display: 销售大区
        definition: 按订单收货地址所属大区划分（七大区口径），与用户注册地、下单主体所在地区无直接对应关系。
        enum:
          华东: 华东
          华南: 华南
          华北: 华北
          华中: 华中
          西南: 西南
          西北: 西北
          东北: 东北
      - name: channel
        type: TEXT
        display: 下单渠道
        definition: 按用户在该订单中提交下单动作所经过的入口划分，与该用户的注册渠道可不同。
        enum:
          app: App
          h5: H5
          miniprogram: 小程序
          pc: PC
      - name: created_at
        type: TEXT
        display: 下单时间
        note: 存储为 ISO8601 字符串，日期函数使用 SQLite 的 strftime / date
      - name: paid_at
        type: TEXT
        display: 支付时间
        note: 未支付订单此字段为空

  - name: order_items
    display: 订单明细表
    synonyms: [订单明细, 明细, 成交明细, 行项目]
    grain: 一行一个订单中的一个商品
    join: "order_items.order_id = orders.id"
    fields:
      - name: id
        type: INTEGER
        display: 明细ID
      - name: order_id
        type: INTEGER
        display: 所属订单ID
        ref: orders.id
      - name: product_id
        type: INTEGER
        display: 商品ID
        ref: products.id
      - name: quantity
        type: INTEGER
        display: 购买数量
      - name: unit_price
        type: REAL
        display: 成交单价
        note: 已含折扣，不等于 products.list_price

  - name: refunds
    display: 退款表
    synonyms: [退款, 退货, 售后, 退单]
    grain: 一行一次退款；同一订单可能发生部分退款
    join: "refunds.order_id = orders.id"
    fields:
      - name: id
        type: INTEGER
        display: 退款ID
      - name: order_id
        type: INTEGER
        display: 关联订单ID
        ref: orders.id
      - name: amount
        type: REAL
        display: 退款金额
      - name: reason
        type: TEXT
        display: 退款原因
        definition: 按售后受理时由客服或自助售后系统归类的退款原因；同一订单发生多次退款时，每次退款独立归类，目前数据无重复。
        enum:
          七天无理由: 七天无理由
          质量问题: 质量问题
          发错货: 发错货
          买家拒收: 买家拒收
      - name: created_at
        type: TEXT
        display: 退款时间

# 维度：业务提问的最小切片单位。表达式是可直接嵌入 SQL 的片段。
dimensions:
  - name: order_date
    display: 下单日期
    synonyms: [每天, 按天, 日, 日期]
    expression: "date(orders.created_at)"
    tables: [orders]

  - name: order_month
    display: 下单月份
    # 走势 / 趋势：说这两个词时用户要的是随时间变化，但不一定明说「按月」。
    # 落到月份而非日期，是因为环比同比的常规粒度是月，日粒度噪声过大。
    synonyms: [每月, 按月, 月度, 月份, 月, 走势, 趋势]
    expression: "strftime('%Y-%m', orders.created_at)"
    tables: [orders]

  - name: order_quarter
    display: 下单季度
    synonyms: [每季度, 按季度, 季度]
    expression: "strftime('%Y', orders.created_at) || '-Q' || ((CAST(strftime('%m', orders.created_at) AS INTEGER) + 2) / 3)"
    tables: [orders]
    note: 季度表达式较绕，生成 SQL 时优先在 Python 侧把「上季度」换算成具体日期区间做过滤，聚合仍用 order_month

  - name: region
    display: 销售大区
    synonyms: [大区, 区域, 地区, 各区域]
    expression: "orders.region"
    tables: [orders]

  - name: channel
    display: 下单渠道
    synonyms: [渠道, 各渠道, 来源]
    expression: "orders.channel"
    tables: [orders]

  - name: category_name
    display: 商品类目
    synonyms: [品类, 类目, 分类, 各品类]
    expression: "categories.name"
    tables: [products, categories]
    note: 需 JOIN products ON order_items.product_id = products.id，再 JOIN categories ON products.category_id = categories.id

  - name: brand
    display: 品牌
    synonyms: [各品牌, 品牌维度]
    expression: "products.brand"
    tables: [products]

  - name: user_level
    display: 会员等级
    synonyms: [会员等级, 等级, 各等级]
    expression: "users.level"
    tables: [users]

  - name: city
    display: 城市
    synonyms: [城市, 各城市]
    expression: "users.city"
    tables: [users]

  # FR-L-3：退款原因维度。refunds.reason 的四个枚举值早已登记在表里，但此前
  # 没有对应维度，按原因分组做不了。
  #
  # FR-L-5 要求同时声明计数口径：refunds 的 grain 是「一行一次退款，同一订单
  # 可能部分退款」，按原因分组后「按笔数」与「按订单数」是两套数，不能留给
  # 生成环节自行选择。count_grain 声明默认口径，count_expressions 给出两种
  # 口径可直接执行的表达式，都写在这里而不是散在 prompt 里。
  - name: refund_reason
    display: 退款原因
    synonyms: [退款原因, 退货原因, 售后原因, 按原因, 各原因, 什么原因]
    expression: "refunds.reason"
    tables: [refunds]
    join_note: 需 JOIN refunds ON refunds.order_id = orders.id
    count_grain: refund_row
    count_expressions:
      refund_row: "COUNT(r.id)"
      order: "COUNT(DISTINCT o.id)"
    grain_note: >-
      默认按退款笔数计（count_grain=refund_row），同一订单发生多次退款时每次
      退款独立计入各自原因。按订单数计改用 count_expressions.order，此时一单
      多退的订单在每个涉及的原因里各计一次，各原因的订单数之和会大于退款订单
      总数。两种口径不可混用。
