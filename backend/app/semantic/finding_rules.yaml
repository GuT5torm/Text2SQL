# FR-L-1 异常判定规则表
#
# 判定必须由服务端确定性规则完成，不能交给模型，理由有三条：
#   1. 桩模式下模型不产出真实结论，规则判定才能让本需求在配置密钥之前验收；
#   2. 「什么算异常」是业务定义，写进配置才可复现。让模型自由发挥会出现
#      同一份数据这次算异常、下次不算；
#   3. 标记要携带 baseline 与 deviation，这两个值是算出来的，不是生成的。
#
# 三条规则并行，任一命中即为异常：
#   deviation  与对比基准的偏离超过阈值（环比优先，环比不可比时用同比）
#   rank       在同维度内排名处于前 / 后若干比例
#   absolute   绝对值越过配置阈值（比率型指标用得多，如退款率 > 10%）
#
# 文件缺失时取 agent/findings.py 里的同组内建默认值，因此最小语义目录不必
# 携带本文件；一旦提供，default 组与字段取值都要通过加载期校验。

default:
  # 与对比基准的相对偏离阈值，正负同幅
  deviation_threshold: 0.20
  # 同维度内排名处于前 / 后各多少比例时判为异常
  rank_ratio: 0.20
  # 切片数少于此值时不做排名判定——三个切片里的第一名没有统计意义
  min_slices: 4
  # 排名规则下「与中位水平的偏离」达到阈值的多少倍时升为「关注」
  severity_ratio: 2.0
  # 规则未指定严重度时的默认级别：提示 / 关注
  severity: 提示

metrics:
  refund_rate:
    absolute:
      # 退款率超过 10% 视为需要跟进，这一档是业务给的口径，不是统计分位数
      threshold: 0.10
      direction: above
      severity: 关注
